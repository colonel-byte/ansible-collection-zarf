---
# The same four packages as bundle-order.yml, on a cluster with no StorageClass, which is what
# forces the order rather than merely permitting it.
#
# The cluster is the one k3d-config.yaml describes: the uds-bundles k3d config, verbatim, which
# disables k3s local-storage. So nothing on this cluster can bind a volume until the storage
# provider is deployed, and the two phases of `zarf init` are on opposite sides of that line:
#
# | Phase                                  | Claims a volume                                         |
# | -------------------------------------- | ------------------------------------------------------- |
# | `zarf-injector`, `zarf-seed-registry`  | No. The seed registry sets `persistence.enabled: false` |
# | `zarf-registry`, `git-server`          | Yes -- 20Gi for the registry, 10Gi for gitea            |
#
# That is what this walk proves and bundle-order.yml cannot: the seed phase comes first and needs
# no storage, the provider is deployed through the registry that phase stood up, and only then can
# the rest of the initialisation claim anything. On bundle-order.yml's cluster k3s already provides
# a StorageClass, so its third step would have bound a volume whatever order it ran in.
#
# The provider is deployed **airgapped**, which is the whole point. An earlier version of this walk
# passed C(connected: true) on that step -- telling zarf not to push the package's images -- so that
# the deploy needed no registry at all. That made the walk pass while testing the one thing an
# air-gapped product never does: it reached out for its own images. The seed registry exists exactly
# so that a package can be pushed before the cluster has persistent storage, and pushing through it
# is what this now does.
#
# git-server is in the rest phase, not the seed phase. It was in the seed phase for a reason that no
# longer holds: `zarf init` carried `--git-push-username=zarf-git-user` as a leaked viper default
# whatever components were asked for, so a later init onto a cluster whose state held no git server
# was read as changing the git server and refused with `cannot change git server information after
# initial init`. internal/zarfmod.pruneInitGitPushUserDefault clears that default, so the git server
# can be introduced by a later phase -- which it has to be here, because gitea claims a volume and
# the seed phase runs before there is one to claim.
#
# The storage provider is deployed twice, as the bundle does. The seed registry keeps its images in
# an emptyDir, so what step 2 pushed into it is gone once step 3 replaces it with the persistent
# registry; step 4 pushes the same package into that one. The already-running provider does not care
# -- its images are on the nodes by then -- which is why the cluster survives the gap.
#
# The idempotence check lives in bundle-order.yml rather than being repeated here; what this walk is
# for is the order.
#
# Nothing here is contacted.
- name: Initialise the seed phase, then deploy the storage provider the rest of it needs
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    # Local to this play rather than shared with bundle-order.yml: this is the only cluster where
    # the split matters, because it is the only one where a volume cannot be bound at the start.
    zarf_init_seed_components: zarf-injector,zarf-seed-registry
    zarf_init_rest_components: zarf-registry,zarf-agent,git-server
    zarf_storage_components: local-path-images,local-path-chart
  tasks:
    - name: Initialise the cluster with the phase that claims no volume
      colonel_byte.zarf.zarf_init:
        wrapper_binary: "{{ zarf_init_wrapper }}"
        components: "{{ zarf_init_seed_components }}"
        init_package: "{{ zarf_init_package }}"
        kubeconfig: "{{ zarf_kubeconfig }}"
        registry_mode: proxy
        timeout: "{{ zarf_timeout | default('15m') }}"
      delegate_to: localhost
      run_once: true
      register: step_init

    - name: Record what the initialisation reported
      ansible.builtin.copy:
        content: "{{ step_init | to_json }}"
        dest: "{{ zarf_result_dir }}/1-init.json"
        mode: "0600"

    - name: Deploy the storage provider through the seed registry
      colonel_byte.zarf.zarf_package_deploy:
        wrapper_binary: "{{ zarf_deploy_wrapper }}"
        package: "{{ zarf_storage_package }}"
        components: "{{ zarf_storage_components }}"
        kubeconfig: "{{ zarf_kubeconfig }}"
        public_key: "{{ zarf_public_key }}"
        verify: always
        # Airgapped: the package's images are pushed to the registry the seed phase stood up,
        # which is what a seed registry is for. Nothing here reaches outside the cluster.
        connected: false
        timeout: "{{ zarf_timeout | default('15m') }}"
      delegate_to: localhost
      run_once: true
      register: step_storage

    - name: Record what the airgapped deploy reported
      ansible.builtin.copy:
        content: "{{ step_storage | to_json }}"
        dest: "{{ zarf_result_dir }}/2-storage.json"
        mode: "0600"

    - name: Initialise the rest, which can now claim the volumes it needs
      colonel_byte.zarf.zarf_init:
        wrapper_binary: "{{ zarf_init_wrapper }}"
        components: "{{ zarf_init_rest_components }}"
        init_package: "{{ zarf_init_package }}"
        kubeconfig: "{{ zarf_kubeconfig }}"
        registry_mode: proxy
        take_ownership: true
        timeout: "{{ zarf_timeout | default('15m') }}"
      delegate_to: localhost
      run_once: true
      register: step_reinit

    - name: Record what the second initialisation reported
      ansible.builtin.copy:
        content: "{{ step_reinit | to_json }}"
        dest: "{{ zarf_result_dir }}/3-reinit.json"
        mode: "0600"

    # The bundle's fourth package: the provider again, now pushed into the persistent registry
    # rather than the seed one, whose emptyDir went with it.
    - name: Deploy the storage provider through the persistent registry
      colonel_byte.zarf.zarf_package_deploy:
        wrapper_binary: "{{ zarf_deploy_wrapper }}"
        package: "{{ zarf_storage_package }}"
        components: "{{ zarf_storage_components }}"
        kubeconfig: "{{ zarf_kubeconfig }}"
        public_key: "{{ zarf_public_key }}"
        verify: always
        connected: false
        take_ownership: true
        force_conflicts: true
        timeout: "{{ zarf_timeout | default('15m') }}"
      delegate_to: localhost
      run_once: true
      register: step_restorage

    - name: Record what the second deploy reported
      ansible.builtin.copy:
        content: "{{ step_restorage | to_json }}"
        dest: "{{ zarf_result_dir }}/4-restorage.json"
        mode: "0600"
