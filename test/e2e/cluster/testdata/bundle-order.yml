---
# The uds-bundle's four packages, in its order, driven by the two zarf modules, plus a fifth step
# this suite adds.
#
# It follows
# https://github.com/colonel-byte/uds-bundles/blob/main/upstream/init-local-path/uds-bundle.yaml,
# which lists the init package and the local-path storage provider twice each, alternating -- and
# which picks different optional components each time. That component split is the bundle, not a
# detail of it: the slim init's five components are all optional, so the first init deploys the
# seed phase and the second deploys the rest. A bundle deploys all four as packages; this playbook
# keeps the alternation and runs the two init halves through
# M(colonel_byte.zarf.zarf_init) instead, because the init half is what the module exists for --
# `zarf init` sets up the cluster's state and the seed registry, and a deploy of the init package
# would prove the deploy module twice rather than the pair.
#
# The fifth step is not in the bundle. It repeats the second init exactly, because converging
# something already converged is the property an Ansible module lives or dies by and the bundle's
# four disjoint steps never ask for it.
#
# Every init step pins the git server credentials, including the first, and the order matters in a
# way that is easy to get wrong. Zarf's init writes a gitServer block into cluster state whether or
# not the git-server component was asked for. Its guard then refuses any later init whose git
# input is non-empty and disagrees with what is stored -- so an init that passes nothing is always
# allowed, and the first init that passes something after one that did not is always refused. The
# first init is therefore where the credentials have to be set: state carries them from then on and
# every later init agrees with it. See docs/agent/choice-zarf-ansible-module.md.
#
# The cluster this runs on is k3d-config-local-storage.yaml, which keeps k3s's StorageClass. That
# is what lets init come first and so lets the bundle's own order be followed. The sibling
# provider-first.yml runs the same packages on a cluster with no StorageClass, where the provider
# has to be deployed before anything can be initialised.
#
# Registry proxy mode is used throughout. Zarf's nodeport mode publishes the registry on a node
# port the push then goes through, and on k3d that push is slow enough to time out and be retried;
# the proxy mode daemonset takes the push on a host port instead.
#
# The git credentials are not pinned here, and that is zarf v0.88 rather than a preference. A first
# init records the git server's credentials only when the git-server component is in the set it was
# asked for -- see cluster.go, `opts.InternalServices.Has(state.GitKey)` -- and the seed phase is
# not that step. Given on a later init they are therefore a change to state that holds nothing,
# which zarf refuses: `cannot change git server information after initial init`. Letting zarf
# generate them is what lets this play be re-run: the re-init branch fills defaults only for a
# service no earlier init configured, so the second run of the same step agrees with the state the
# first one wrote. test/e2e/cluster/testdata/acting-modules.yml rotates them afterwards with
# zarf_update_creds, which is the command zarf's own error names.
- name: Walk the uds-bundle's packages in its own order
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    # The bundle's two component sets. The seed phase stands up the registry the rest of init
    # needs; the second half is what claims a volume and so needs a StorageClass to exist.
    # git-server is in the seed set rather than only in the rest set, and that is zarf v0.88
    # rather than the bundle's shape. Two of its behaviours meet badly: a first init records the
    # git server's credentials only when the git-server component is in the set it was asked for
    # (cluster.go, `opts.InternalServices.Has(state.GitKey)`), and `zarf init` carries
    # --git-push-username=zarf-git-user as a flag default whether or not anybody asked for it --
    # a viper default another command sets, which root.go's own comment warns about leaking. So a
    # second init onto a cluster whose state holds no git server is read as changing the git
    # server, and refused: `cannot change git server information after initial init`. Deploying
    # git-server in the first step is what makes the state it compares against exist.
    zarf_init_seed_components: zarf-injector,zarf-seed-registry,git-server
    zarf_init_rest_components: zarf-registry,zarf-agent
    zarf_storage_components: local-path-images,local-path-chart
    # Required because the registry mode is proxy: zarf v0.89 removed GetInjectorDaemonsetImage,
    # the heuristic that picked the smallest pause image already on a node, so the image is now
    # named or init refuses to run. This is that same pause image, read off the nodes of the
    # cluster k3d-config-local-storage.yaml builds -- so it is pinned to the k3s image that file
    # pins, and bumping k3s is what would make it wrong.
    zarf_injector_image: docker.io/rancher/mirrored-pause:3.10.2
  tasks:
    # Package 1 of the bundle: the init package, seed phase only.
    - name: Initialise the cluster
      colonel_byte.zarf.zarf_init:
        wrapper_binary: "{{ zarf_init_wrapper }}"
        init_package: "{{ zarf_init_package }}"
        components: "{{ zarf_init_seed_components }}"
        kubeconfig: "{{ zarf_kubeconfig }}"
        public_key: "{{ zarf_public_key }}"
        verify: always
        registry_mode: proxy
        injector_image: "{{ zarf_injector_image }}"
        timeout: "{{ zarf_timeout | default('15m') }}"
      delegate_to: localhost
      run_once: true
      register: step_init

    - name: Record what the initialisation reported
      ansible.builtin.copy:
        content: "{{ step_init | to_json }}"
        dest: "{{ zarf_result_dir }}/1-init.json"
        mode: "0600"

    # Package 2 of the bundle: the local-path storage provider, deployed through the seed registry
    # the initialisation above stood up.
    #
    # take_ownership and force_conflicts are needed here and not in provider-first.yml: this
    # cluster keeps k3s's own local-storage, so a StorageClass named local-path already exists.
    # Helm refuses to adopt an object it did not create without the first, and server-side apply
    # then refuses the annotations k3s's own deploy controller owns without the second. A cluster
    # that already has a storage provider is the case an operator meets both parameters in.
    - name: Deploy the storage provider
      colonel_byte.zarf.zarf_package_deploy:
        wrapper_binary: "{{ zarf_deploy_wrapper }}"
        package: "{{ zarf_storage_package }}"
        components: "{{ zarf_storage_components }}"
        kubeconfig: "{{ zarf_kubeconfig }}"
        public_key: "{{ zarf_public_key }}"
        verify: always
        take_ownership: true
        force_conflicts: true
        timeout: "{{ zarf_timeout | default('15m') }}"
      delegate_to: localhost
      run_once: true
      register: step_storage

    - name: Record what the storage provider deploy reported
      ansible.builtin.copy:
        content: "{{ step_storage | to_json }}"
        dest: "{{ zarf_result_dir }}/2-storage.json"
        mode: "0600"

    # Package 3 of the bundle: the init package again, this time the rest of it. The registry it
    # stands up claims a 20Gi volume, which is why it follows the storage provider.
    - name: Initialise the cluster again
      colonel_byte.zarf.zarf_init:
        wrapper_binary: "{{ zarf_init_wrapper }}"
        init_package: "{{ zarf_init_package }}"
        components: "{{ zarf_init_rest_components }}"
        kubeconfig: "{{ zarf_kubeconfig }}"
        public_key: "{{ zarf_public_key }}"
        verify: always
        registry_mode: proxy
        injector_image: "{{ zarf_injector_image }}"
        timeout: "{{ zarf_timeout | default('15m') }}"
      delegate_to: localhost
      run_once: true
      register: step_reinit

    - name: Record what the second initialisation reported
      ansible.builtin.copy:
        content: "{{ step_reinit | to_json }}"
        dest: "{{ zarf_result_dir }}/3-reinit.json"
        mode: "0600"

    # Package 4 of the bundle: the storage provider again, now through the full registry.
    - name: Deploy the storage provider again
      colonel_byte.zarf.zarf_package_deploy:
        wrapper_binary: "{{ zarf_deploy_wrapper }}"
        package: "{{ zarf_storage_package }}"
        components: "{{ zarf_storage_components }}"
        kubeconfig: "{{ zarf_kubeconfig }}"
        public_key: "{{ zarf_public_key }}"
        verify: always
        take_ownership: true
        force_conflicts: true
        timeout: "{{ zarf_timeout | default('15m') }}"
      delegate_to: localhost
      run_once: true
      register: step_restorage

    - name: Record what the second storage provider deploy reported
      ansible.builtin.copy:
        content: "{{ step_restorage | to_json }}"
        dest: "{{ zarf_result_dir }}/4-restorage.json"
        mode: "0600"

    # Not in the bundle: the same init as step 3, with the same parameters. A playbook is expected
    # to be re-runnable, so the interesting answer is that this succeeds rather than what it
    # changes -- zarf reports which components it deployed, never that one was already as it
    # wanted, so the module cannot honestly say "unchanged" here. See
    # docs/agent/choice-zarf-ansible-module.md.
    - name: Initialise the cluster a third time, unchanged
      colonel_byte.zarf.zarf_init:
        wrapper_binary: "{{ zarf_init_wrapper }}"
        init_package: "{{ zarf_init_package }}"
        components: "{{ zarf_init_rest_components }}"
        kubeconfig: "{{ zarf_kubeconfig }}"
        public_key: "{{ zarf_public_key }}"
        verify: always
        registry_mode: proxy
        injector_image: "{{ zarf_injector_image }}"
        timeout: "{{ zarf_timeout | default('15m') }}"
      delegate_to: localhost
      run_once: true
      register: step_idempotent

    - name: Record what the idempotence check reported
      ansible.builtin.copy:
        content: "{{ step_idempotent | to_json }}"
        dest: "{{ zarf_result_dir }}/5-idempotent.json"
        mode: "0600"
