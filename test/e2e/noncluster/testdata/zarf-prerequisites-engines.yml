---
# What the colonel_byte.zarf.prerequisites role does with the GitOps engine sections of a document.
#
# The sibling of zarf-prerequisites.yml, which covers the core flow: extraction from a real
# package, a satisfied document, an unsatisfied one reported and then enforced, and a version range
# the role cannot evaluate. Everything here is about which engine a document names and what follows
# from that, which is the half of the format with the most ways to be quietly wrong.
#
# The cluster is the same testdata/zarf-cluster-stub.sh over the zarf-cluster-*.json fixtures:
# Kubernetes v1.31.2+k3s1, Flux v2.9.5 in flux-system with an available source-controller and a
# helm-controller that is ready and not available, a second and newer Flux in gitops labelled
# v2.11.0, and an Argo CD v3.5.5 in argocd whose argocd-application-controller is a StatefulSet.
#
# Nothing here is contacted.
- name: The prerequisites role resolves the GitOps engine a document names
  hosts: localhost
  connection: local
  gather_facts: false

  tasks:
    - name: A Flux outside flux-system is found, with one controller leaving its namespace unset
      # The regression this case exists for. _namespaces in the role builds the namespaces to look
      # in from the document's own controller list, and namespace is optional with a documented
      # default of flux-system -- so a list mixing an explicit namespace with an omitted one used to
      # raise inside the map, collapse the whole expression to Undefined, and fall back to
      # ['flux-system'] alone. The explicitly named gitops was then never looked in, the constraint
      # found no version to compare, and it was recorded as skipped: the role passed a cluster whose
      # Flux version it had not checked.
      #
      # notification-controller is deliberately absent from the cluster, so flux-system offers this
      # document no version at all. The only version reachable is v2.11.0 in gitops, which means a
      # satisfied constraint here is proof the gitops namespace survived.
      ansible.builtin.include_role:
        name: colonel_byte.zarf.prerequisites
      vars:
        zarf_binary: "{{ zarf_binary }}"
        zarf_prerequisites_enforce: false
        zarf_prerequisites:
          apiVersion: colonel-byte.dev/v1alpha1
          kind: PackagePrerequisites
          metadata:
            package: a-package-wanting-flux-in-gitops
            version: 1.0.0
          requires:
            fluxcd:
              version: ">=2.11.0"
            controllers:
              - name: kustomize-controller
                namespace: gitops
              - name: notification-controller

    - name: The version came from gitops, and the absent controller is the only complaint
      ansible.builtin.assert:
        that:
          # The constraint was evaluated rather than skipped, which is the whole point: before the
          # fix this list was empty and the constraint sat in zarf_prerequisites_skipped.
          - zarf_prerequisites_checked | select('search', 'fluxcd version') | list | length == 1
          - zarf_prerequisites_skipped == []
          # v2.11.0 satisfies >=2.11.0, so the version is not among the unmet. The one unmet thing
          # is notification-controller, which no namespace holds.
          - zarf_prerequisites_unmet | select('search', 'fluxcd version') | list | length == 0
          - zarf_prerequisites_unmet | select('search', 'notification-controller') | list | length == 1
          - zarf_prerequisites_unmet | length == 1
        success_msg: ASSERTED a controller with no namespace does not discard the namespaces beside it
        fail_msg: the role lost an explicitly named controller namespace, so the Flux version went unchecked

    - name: An ArgoCD document, whose most important controller is a StatefulSet
      # The case the engine discriminator and the kind field exist for. argocd-application-controller
      # is a StatefulSet and argocd-server is a Deployment, both in the argocd namespace, and the
      # version label on them reads v3.5.5.
      #
      # Neither controller names a namespace. That is the engine default doing its job: with
      # the argocd key the role looks in argocd rather than in flux-system, and the same document
      # under the fluxcd key would find nothing at all.
      ansible.builtin.include_role:
        name: colonel_byte.zarf.prerequisites
      vars:
        zarf_binary: "{{ zarf_binary }}"
        zarf_check_packages: false
        zarf_prerequisites_enforce: false
        zarf_prerequisites:
          apiVersion: colonel-byte.dev/v1alpha1
          kind: PackagePrerequisites
          metadata:
            package: a-package-wanting-argocd
            version: 1.0.0
          requires:
            argocd:
              version: ">=3.5.0"
            controllers:
              - name: argocd-application-controller
                kind: StatefulSet
              - name: argocd-server
            crds:
              - applications.argoproj.io
              - appprojects.argoproj.io

    - name: Every ArgoCD prerequisite held, the StatefulSet included
      ansible.builtin.assert:
        that:
          - zarf_prerequisites_unmet == []
          - zarf_prerequisites_skipped == []
          # The engine version, the two controllers, and the two CRDs.
          - zarf_prerequisites_checked | length == 5
          - zarf_prerequisites_checked | select('search', 'argocd version') | list | length == 1
          # Named as a StatefulSet in the message, not as a Deployment: the kind is matched, so a
          # role that only ever looked at Deployments reports this one absent instead.
          - zarf_prerequisites_checked | select('search', 'StatefulSet argocd-application-controller in argocd') | list | length == 1
          - zarf_prerequisites_checked | select('search', 'Deployment argocd-server in argocd') | list | length == 1
        success_msg: ASSERTED an ArgoCD document is checked, StatefulSet controller and all
        fail_msg: the role did not check the ArgoCD document against the fixture cluster

    - name: The same ArgoCD controllers, looked for under the wrong engine
      # The engine default is load-bearing, and this is what proves it. The identical controller
      # list under the fluxcd key is looked for in flux-system, where no argocd component is, so
      # both come back absent. A role that ignored the engine would pass this.
      ansible.builtin.include_role:
        name: colonel_byte.zarf.prerequisites
      vars:
        zarf_binary: "{{ zarf_binary }}"
        zarf_check_packages: false
        zarf_prerequisites_enforce: false
        zarf_prerequisites:
          apiVersion: colonel-byte.dev/v1alpha1
          kind: PackagePrerequisites
          metadata:
            package: a-package-looking-in-the-wrong-namespace
            version: 1.0.0
          requires:
            fluxcd: {}
            controllers:
              - name: argocd-application-controller
                kind: StatefulSet
              - name: argocd-server

    - name: Both are reported absent from flux-system
      ansible.builtin.assert:
        that:
          - zarf_prerequisites_unmet | length == 2
          - zarf_prerequisites_unmet | select('search', 'not deployed in flux-system') | list | length == 2
        success_msg: ASSERTED the engine decides which namespace a controller defaults to
        fail_msg: the engine default namespace is not being applied

    - name: A document requiring both engines at once is refused
      # Unrepresentable in the schema -- `not: {required: [fluxcd, argocd]}` -- but a document
      # reaches the role through zarf_prerequisites without ever meeting a validator, so the role
      # refuses it too. Picking one of the two silently is the kind of guess this role exists not
      # to make.
      block:
        - name: Include the role with both engine keys set
          ansible.builtin.include_role:
            name: colonel_byte.zarf.prerequisites
          vars:
            zarf_binary: "{{ zarf_binary }}"
            zarf_check_packages: false
            zarf_prerequisites:
              apiVersion: colonel-byte.dev/v1alpha1
              kind: PackagePrerequisites
              metadata:
                package: a-package-that-cannot-decide
                version: 1.0.0
              requires:
                fluxcd:
                  version: ">=2.9.0"
                argocd:
                  version: ">=3.5.0"

        - name: The role should not have got this far
          ansible.builtin.fail:
            msg: the role accepted a document requiring two GitOps engines at once
      rescue:
        - name: The role refused, naming both engines
          ansible.builtin.assert:
            that:
              - "'fluxcd' in ansible_failed_result.msg"
              - "'argocd' in ansible_failed_result.msg"
            success_msg: ASSERTED a document requiring both GitOps engines is refused
            fail_msg: the role failed, but not because the document named two engines

    - name: A version required of a workload that is not a GitOps engine
      # The case the version on a controller requirement exists for. No fluxcd and no argocd key
      # anywhere in this document: the package needs a particular workload at a particular version
      # and has no opinion about what reconciles the cluster. Before controllers carried a version
      # the only way to say this was to require an engine the package does not use.
      #
      # Three outcomes in one document, which is the point: a constraint that holds, one that does
      # not, and one that cannot be evaluated because the workload carries no version label at all.
      ansible.builtin.include_role:
        name: colonel_byte.zarf.prerequisites
      vars:
        zarf_binary: "{{ zarf_binary }}"
        zarf_check_packages: false
        zarf_prerequisites_enforce: false
        zarf_prerequisites:
          apiVersion: colonel-byte.dev/v1alpha1
          kind: PackagePrerequisites
          metadata:
            package: a-package-with-no-engine-opinion
            version: 1.0.0
          requires:
            controllers:
              # Holds: the fixture reports v3.5.5.
              - name: argocd-server
                namespace: argocd
                version: ">=3.5.0"
              # Does not: the same workload cannot be v4.
              - name: argocd-application-controller
                namespace: argocd
                kind: StatefulSet
                version: ">=4.0.0"
              # Cannot be evaluated: coredns carries no app.kubernetes.io/version label, which is
              # ordinary for a workload nobody stamped. Reported, never assumed satisfied.
              - name: coredns
                namespace: kube-system
                version: ">=1.11.0"

    - name: The workload versions are checked, failed and skipped on their own merits
      ansible.builtin.assert:
        that:
          # The satisfied one, and all three availability checks.
          - zarf_prerequisites_checked | select('search', 'argocd-server in argocd >=3.5.0') | list | length == 1
          # The failed one names what it found and what was wanted.
          - zarf_prerequisites_unmet | length == 1
          - zarf_prerequisites_unmet | select('search', 'argocd-application-controller') | list | length == 1
          - zarf_prerequisites_unmet | select('search', '3.5.5') | list | length == 1
          # The unlabelled one is skipped, not passed.
          - zarf_prerequisites_skipped | length == 1
          - zarf_prerequisites_skipped | select('search', 'coredns') | list | length == 1
          - "'no version to compare' in zarf_prerequisites_skipped | join(' ')"
        success_msg: ASSERTED a workload version is checked without naming a GitOps engine
        fail_msg: a controller version constraint was not evaluated on its own merits

    # An engine the role has no namespace for. zarf_engine_namespaces exists to be overridden, and
    # narrowing it used to make a document requiring the other engine vanish: the engine key is
    # enumerated from the mapping, so one the mapping lacks was never looked at and nothing said so.
    - name: A document requiring an engine the namespace mapping does not place
      ansible.builtin.include_role:
        name: colonel_byte.zarf.prerequisites
      vars:
        zarf_binary: "{{ zarf_binary }}"
        zarf_engine_namespaces:
          fluxcd: flux-system
        zarf_prerequisites:
          apiVersion: colonel-byte.dev/v1alpha1
          kind: PackagePrerequisites
          metadata:
            package: a-package-needing-an-engine-the-role-cannot-place
            version: 1.0.0
          requires:
            argocd:
              version: ">=3.5.0"

    - name: The unplaced engine was reported as unchecked rather than passed
      ansible.builtin.assert:
        that:
          - zarf_prerequisites_unmet == []
          - "'argocd' in zarf_prerequisites_skipped | join(' ')"
          - "'zarf_engine_namespaces does not place' in zarf_prerequisites_skipped | join(' ')"
        success_msg: ASSERTED an engine the namespace mapping does not place is named as unchecked
        fail_msg: an engine requirement the role cannot place was silently ignored
