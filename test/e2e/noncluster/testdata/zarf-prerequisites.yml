---
# What the colonel_byte.zarf.prerequisites role does with a document and a cluster.
#
# The cluster is testdata/zarf-cluster-stub.sh over the zarf-cluster-*.json fixtures, which is a
# cluster running Kubernetes v1.31.2+k3s1 and Flux v2.9.5, with three Flux CRDs, a default
# StorageClass called local-path, an available source-controller, a helm-controller that is ready
# and not available, and the init and app-fluxcd packages deployed. It also holds a second,
# newer Flux outside flux-system: an available kustomize-controller in gitops labelled v2.11.0,
# which is what the last case below reads.
#
# The package is built from testdata/zarf-inspect-fixture by the Go test, and the stub hands
# documentation extraction to the real zarf -- so the first case below walks the whole role,
# extraction included, with no cluster anywhere.
#
# Nothing here is contacted.
- name: The prerequisites role checks a cluster against a package's document
  hosts: localhost
  connection: local
  gather_facts: false

  tasks:
    - name: A package whose prerequisites the cluster satisfies
      ansible.builtin.include_role:
        name: colonel_byte.zarf.prerequisites
      vars:
        zarf_package: "{{ fixture_package }}"
        zarf_binary: "{{ zarf_binary }}"

    - name: The document was extracted from the package and every check held
      # accessModes is the one thing that has to be reported as skipped rather than passed. What a
      # provisioner will bind cannot be known without creating a PersistentVolumeClaim, and a role
      # that counted it as satisfied would be reporting a check it never made.
      ansible.builtin.assert:
        that:
          - zarf_prerequisites_document.metadata.package == 'inspect-fixture'
          - zarf_prerequisites_document.apiVersion == 'colonel-byte.dev/v1alpha1'
          - zarf_prerequisites_unmet == []
          # Eight: the Kubernetes and Flux versions, the prerequisite package's version and its
          # presence, the controller, the CRD, the default StorageClass and the named one.
          - zarf_prerequisites_checked | length == 8
          - zarf_prerequisites_skipped | length == 1
          - "'accessModes' in zarf_prerequisites_skipped | join(' ')"
          - "'PersistentVolumeClaim' in zarf_prerequisites_skipped | join(' ')"
        success_msg: ASSERTED a satisfied document is extracted, checked, and reports what it skipped
        fail_msg: the role did not report the fixture cluster as satisfying the fixture package

    - name: A document the cluster does not satisfy, reported rather than enforced
      # Supplied directly rather than read from a package, which is what zarf_prerequisites is for.
      # Three things are wrong with it at once, and the point of the case is that all three are
      # reported: the role appends to a list and asserts once, so that an operator is not told to
      # fix one thing, told to fix the next, and told to fix the third.
      ansible.builtin.include_role:
        name: colonel_byte.zarf.prerequisites
      vars:
        zarf_binary: "{{ zarf_binary }}"
        zarf_prerequisites_enforce: false
        zarf_prerequisites:
          apiVersion: colonel-byte.dev/v1alpha1
          kind: PackagePrerequisites
          metadata:
            package: a-package-this-cluster-is-not-ready-for
            version: 1.0.0
          requires:
            kubernetes:
              version: ">=1.99.0"
            controllers:
              - name: helm-controller
                namespace: flux-system
                minAvailable: 1
            crds:
              - externalsecrets.external-secrets.io
            packages:
              - name: operator-external-secrets

    - name: Every unsatisfied prerequisite is reported, and the play continued
      # helm-controller is in the fixture with readyReplicas and no availableReplicas, so this is
      # also the case that holds the availability-is-not-readiness rule from the cluster's side: a
      # role that read `ready` would find this controller satisfactory.
      ansible.builtin.assert:
        that:
          - zarf_prerequisites_unmet | length == 4
          - zarf_prerequisites_unmet | select('search', 'Kubernetes') | list | length == 1
          - zarf_prerequisites_unmet | select('search', 'helm-controller') | list | length == 1
          - zarf_prerequisites_unmet | select('search', 'externalsecrets.external-secrets.io') | list | length == 1
          - zarf_prerequisites_unmet | select('search', 'operator-external-secrets') | list | length == 1
        success_msg: ASSERTED every unsatisfied prerequisite is reported at once
        fail_msg: the role did not report all four unsatisfied prerequisites

    - name: The same document, enforced
      block:
        - name: Include the role with enforcement left at its default
          ansible.builtin.include_role:
            name: colonel_byte.zarf.prerequisites
          vars:
            zarf_binary: "{{ zarf_binary }}"
            zarf_prerequisites:
              apiVersion: colonel-byte.dev/v1alpha1
              kind: PackagePrerequisites
              metadata:
                package: a-package-this-cluster-is-not-ready-for
                version: 1.0.0
              requires:
                crds:
                  - externalsecrets.external-secrets.io

        - name: The role should not have got this far
          ansible.builtin.fail:
            msg: >-
              the prerequisites role accepted a cluster missing a CRD the document requires, so
              zarf_prerequisites_enforce is not being applied
      rescue:
        - name: The role refused, naming the CRD and the package
          ansible.builtin.assert:
            that:
              - "'externalsecrets.external-secrets.io' in ansible_failed_result.msg"
              - "'a-package-this-cluster-is-not-ready-for' in ansible_failed_result.msg"
            success_msg: ASSERTED an unsatisfied prerequisite fails the play by default
            fail_msg: the role failed, but not because of the prerequisite it should have named

    - name: A version range the role cannot evaluate is skipped rather than passed
      # A compound range needs a semver library and Jinja is not one. The role reads one comparator
      # and one version, and names anything else in zarf_prerequisites_skipped -- because the
      # alternative, treating a half-parsed range as satisfied, is a check that reports success for
      # a comparison it never made.
      ansible.builtin.include_role:
        name: colonel_byte.zarf.prerequisites
      vars:
        zarf_binary: "{{ zarf_binary }}"
        zarf_prerequisites:
          apiVersion: colonel-byte.dev/v1alpha1
          kind: PackagePrerequisites
          metadata:
            package: a-package-with-a-range
            version: 1.0.0
          requires:
            kubernetes:
              version: ">=1.30.0 <1.31.0"

    - name: The range is named as unevaluated, and nothing is reported as unmet
      ansible.builtin.assert:
        that:
          - zarf_prerequisites_unmet == []
          - zarf_prerequisites_checked == []
          - zarf_prerequisites_skipped | length == 1
          - "'cannot evaluate' in zarf_prerequisites_skipped | join(' ')"
        success_msg: ASSERTED a range the role cannot evaluate is skipped and named
        fail_msg: a compound version range was not reported as unevaluated

    - name: A package requirement naming several acceptable packages, one of them deployed
      ansible.builtin.include_role:
        name: colonel_byte.zarf.prerequisites
      vars:
        zarf_binary: "{{ zarf_binary }}"
        zarf_prerequisites:
          apiVersion: colonel-byte.dev/v1alpha1
          kind: PackagePrerequisites
          metadata:
            package: a-package-with-alternative-prereqs
            version: 1.0.0
          requires:
            packages:
              # The cluster has init at v0.85.0 and not init-slim, so naming both is satisfied by
              # the one it has -- and the constraint is stated once for both rather than per name.
              - names:
                  - init-slim
                  - init
                version: ">=0.85.0"

    - name: The requirement is satisfied by the name the cluster has, and its version checked
      ansible.builtin.assert:
        that:
          - zarf_prerequisites_unmet == []
          - zarf_prerequisites_checked | length == 2
          - "'one of the zarf packages init-slim, init is deployed' in zarf_prerequisites_checked | join(' ')"
          # The version check follows the deployed package, so it names init and not init-slim.
          - "'the deployed zarf package init' in zarf_prerequisites_checked | join(' ')"
          - "'init-slim satisfies' not in zarf_prerequisites_checked | join(' ')"
        success_msg: ASSERTED a requirement naming several packages is met by the one the cluster has
        fail_msg: a requirement naming several packages was not satisfied by the deployed one

    - name: A package requirement naming several acceptable packages, none of them deployed
      ansible.builtin.include_role:
        name: colonel_byte.zarf.prerequisites
      vars:
        zarf_binary: "{{ zarf_binary }}"
        zarf_prerequisites_enforce: false
        zarf_prerequisites:
          apiVersion: colonel-byte.dev/v1alpha1
          kind: PackagePrerequisites
          metadata:
            package: a-package-with-unsatisfied-alternatives
            version: 1.0.0
          requires:
            packages:
              - names:
                  - foo-pkg
                  - bar-pkg

    - name: The unsatisfied requirement is reported as unmet, naming every acceptable package
      ansible.builtin.assert:
        that:
          - zarf_prerequisites_unmet | length == 1
          - "'one of the zarf packages foo-pkg, bar-pkg is required and is not deployed' in zarf_prerequisites_unmet | first"
        success_msg: ASSERTED a requirement naming several packages is unmet when the cluster has none
        fail_msg: an unsatisfied requirement naming several packages was not reported as unmet

    # The branch that names what it did not check. It is reached only with zarf_check_packages
    # false, and it has to name every package the list mentions -- the one a `name` entry names
    # and every one a `names` entry does.
    - name: Package requirements of both shapes, with the package check turned off
      ansible.builtin.include_role:
        name: colonel_byte.zarf.prerequisites
      vars:
        zarf_binary: "{{ zarf_binary }}"
        zarf_check_packages: false
        zarf_prerequisites:
          apiVersion: colonel-byte.dev/v1alpha1
          kind: PackagePrerequisites
          metadata:
            package: a-package-whose-packages-are-not-checked
            version: 1.0.0
          requires:
            packages:
              - name: app-fluxcd
                version: ">=1.0.0"
              - names:
                  - init
                  - init-slim
              - names:
                  - csi-local-path-provider
                  - csi-rook-ceph

    - name: The unchecked package requirement names every package it did not check
      ansible.builtin.assert:
        that:
          - zarf_prerequisites_unmet == []
          - zarf_prerequisites_skipped | length == 1
          - "'zarf_check_packages is false' in zarf_prerequisites_skipped | first"
          - "'app-fluxcd' in zarf_prerequisites_skipped | first"
          - "'init-slim' in zarf_prerequisites_skipped | first"
          - "'csi-rook-ceph' in zarf_prerequisites_skipped | first"
        success_msg: ASSERTED the skipped package check names every package both shapes mention
        fail_msg: the skipped package check did not name every package the document mentions

    # The role refuses what the schema refuses. A document handed over through zarf_prerequisites
    # never met a validator, and the checks read `names` in preference to `name`, so an entry
    # carrying both would be checked as something other than what it says.
    - name: A package requirement carrying both name and names
      block:
        - name: Include the role with the ambiguously named requirement
          ansible.builtin.include_role:
            name: colonel_byte.zarf.prerequisites
          vars:
            zarf_binary: "{{ zarf_binary }}"
            zarf_prerequisites:
              apiVersion: colonel-byte.dev/v1alpha1
              kind: PackagePrerequisites
              metadata:
                package: a-package-with-an-ambiguous-requirement
                version: 1.0.0
              requires:
                packages:
                  - name: init
                    names:
                      - init
                      - init-slim

        - name: The role should not have got this far
          ansible.builtin.fail:
            msg: >-
              the prerequisites role accepted an entry carrying both name and names, which it
              would then check as names alone
      rescue:
        - name: The role refused, naming the rule and the entry
          ansible.builtin.assert:
            that:
              - "'exactly one of the two' in ansible_failed_result.msg"
              - "'init-slim' in ansible_failed_result.msg"
            success_msg: ASSERTED an entry carrying both name and names is refused
            fail_msg: the role failed, but not because of the ambiguously named requirement

    # Two requirements constraining the same deployed package. Both have to be evaluated: reading
    # the constraints off the deployed package and taking the first reported success against one
    # and never looked at the other, which is a silent pass.
    - name: Two requirements constraining the same deployed package, one of them unsatisfiable
      ansible.builtin.include_role:
        name: colonel_byte.zarf.prerequisites
      vars:
        zarf_binary: "{{ zarf_binary }}"
        zarf_prerequisites_enforce: false
        zarf_prerequisites:
          apiVersion: colonel-byte.dev/v1alpha1
          kind: PackagePrerequisites
          metadata:
            package: a-package-constraining-init-twice
            version: 1.0.0
          requires:
            packages:
              - name: init
                version: ">=0.85.0"
              - names:
                  - init
                  - init-slim
                version: ">=2.0.0"

    - name: Both constraints on the same package were evaluated, and the unsatisfiable one is unmet
      ansible.builtin.assert:
        that:
          - zarf_prerequisites_checked | select('search', 'the deployed zarf package init') | list | length == 2
          - zarf_prerequisites_unmet | length == 1
          - "'>=2.0.0' in zarf_prerequisites_unmet | first"
        success_msg: ASSERTED every constraint on one deployed package is evaluated, not just the first
        fail_msg: a second constraint on the same deployed package was dropped

    # The entry carrying both keys and the entry carrying neither cancel out in any count of
    # namings across the list, so the rule has to be applied per entry.
    - name: One entry naming a package twice and another naming none
      block:
        - name: Include the role with both malformed entries
          ansible.builtin.include_role:
            name: colonel_byte.zarf.prerequisites
          vars:
            zarf_binary: "{{ zarf_binary }}"
            zarf_prerequisites:
              apiVersion: colonel-byte.dev/v1alpha1
              kind: PackagePrerequisites
              metadata:
                package: a-package-whose-entries-cancel-out
                version: 1.0.0
              requires:
                packages:
                  - name: init
                    names:
                      - init
                      - init-slim
                  - version: ">=1.0.0"

        - name: The role should not have got this far
          ansible.builtin.fail:
            msg: >-
              the prerequisites role accepted one entry carrying both name and names alongside one
              carrying neither, so the rule is being counted across the list rather than applied
              to each entry

      rescue:
        - name: The role refused, naming both malformed entries
          ansible.builtin.assert:
            that:
              - "'carry both' in ansible_failed_result.msg"
              - "'carry neither' in ansible_failed_result.msg"
            success_msg: ASSERTED the naming rule is applied per entry rather than counted
            fail_msg: the role failed, but not because of the two malformed entries

    # Package requirements grouped by id: satisfied when at least one branch matches deployed package and version.
    - name: Package requirements grouped by id with one alternative satisfied
      ansible.builtin.include_role:
        name: colonel_byte.zarf.prerequisites
      vars:
        zarf_binary: "{{ zarf_binary }}"
        zarf_prerequisites:
          apiVersion: colonel-byte.dev/v1alpha1
          kind: PackagePrerequisites
          metadata:
            package: a-package-with-id-group-satisfied
            version: 1.0.0
          requires:
            packages:
              - name: csi-rook-ceph
                version: ">=1.21.0"
                id: storage
              - name: csi-local-path-provider
                version: ">=0.0.30"
                id: storage

    - name: The id group is reported as satisfied
      ansible.builtin.assert:
        that:
          - zarf_prerequisites_unmet == []
          - zarf_prerequisites_checked | length == 1
          - "'one of the alternative zarf packages for storage' in zarf_prerequisites_checked | first"
        success_msg: ASSERTED an id group is satisfied when one branch matches
        fail_msg: an id group with a satisfied branch was not reported as satisfied

    # Package requirements grouped by id: unmet when no branch satisfies both deployment and version.
    - name: Package requirements grouped by id with all alternatives unsatisfied
      ansible.builtin.include_role:
        name: colonel_byte.zarf.prerequisites
      vars:
        zarf_binary: "{{ zarf_binary }}"
        zarf_prerequisites_enforce: false
        zarf_prerequisites:
          apiVersion: colonel-byte.dev/v1alpha1
          kind: PackagePrerequisites
          metadata:
            package: a-package-with-id-group-unmet
            version: 1.0.0
          requires:
            packages:
              - name: csi-rook-ceph
                version: ">=1.21.0"
                id: storage
              - name: csi-longhorn
                version: ">=1.13.0"
                id: storage

    - name: The unsatisfied id group is reported as a single unmet failure naming candidates
      ansible.builtin.assert:
        that:
          - zarf_prerequisites_unmet | length == 1
          - "'one of the alternative zarf packages for storage (csi-rook-ceph >=1.21.0 or csi-longhorn >=1.13.0) is required' in zarf_prerequisites_unmet | first"
        success_msg: ASSERTED an unsatisfied id group is reported as a single failure naming all candidates
        fail_msg: an unsatisfied id group was not reported as expected

    # The third way an id group fails, and the one that used to be reported as a lie. A branch's
    # package IS deployed; its constraint is a compound range, which this role documents as
    # unevaluable. The group still fails -- a group's contract is "one of these, at an acceptable
    # version", and a constraint the role cannot read proves nothing -- but it has to say so
    # rather than claim nothing is deployed or that a comparison was made and lost.
    - name: An id group whose only deployed branch carries a range the role cannot evaluate
      ansible.builtin.include_role:
        name: colonel_byte.zarf.prerequisites
      vars:
        zarf_binary: "{{ zarf_binary }}"
        zarf_prerequisites_enforce: false
        zarf_prerequisites:
          apiVersion: colonel-byte.dev/v1alpha1
          kind: PackagePrerequisites
          metadata:
            package: a-package-whose-id-group-cannot-be-verified
            version: 1.0.0
          requires:
            packages:
              # init is deployed at v0.85.0 on the stub's cluster.
              - name: init
                version: ">=0.85.0 <1.0.0"
                id: storage
              - name: csi-longhorn
                version: ">=1.13.0"
                id: storage

    - name: The group says the constraint could not be read, not that nothing is deployed
      ansible.builtin.assert:
        that:
          - zarf_prerequisites_unmet | length == 1
          - "'cannot evaluate' in zarf_prerequisites_unmet | first"
          - "'none of them is deployed' not in zarf_prerequisites_unmet | first"
          - "'does not satisfy' not in zarf_prerequisites_unmet | first"
          # The range itself is still named in its own right, which is the actionable half.
          - "'cannot evaluate' in zarf_prerequisites_skipped | join(' ')"
        success_msg: ASSERTED an id group names an unreadable constraint rather than asserting absence
        fail_msg: an id group reported the wrong reason for failing
