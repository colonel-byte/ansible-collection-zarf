#
# Nothing here is contacted.
kind: ZarfPackageConfig
metadata:
  name: workload-app
  version: 1.0.0
  description: The consumer the whole plan is built for
documentation:
  prerequisites: docs/prerequisites.yaml

components:
  - name: placeholder
    required: true
