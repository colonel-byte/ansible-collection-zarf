---
# yaml-language-server: $schema=../../../../../../../schema/zarf-v1alpha1-package-prerequisites-schema.json
#
# A consumer requiring csi-rook-ceph at `<=1.0.0` while the only csi-rook-ceph in the pool is 1.18.0. The planner must fail naming both versions rather than deploy the one it has.
#
# Nothing here is contacted.
apiVersion: colonel-byte.dev/v1alpha1
kind: PackagePrerequisites
metadata:
  package: workload-pinned
  version: 1.0.0
  description: A consumer whose version constraint no archive in the pool satisfies

requires:
  packages:
    - name: csi-rook-ceph
      version: "<=1.0.0"
