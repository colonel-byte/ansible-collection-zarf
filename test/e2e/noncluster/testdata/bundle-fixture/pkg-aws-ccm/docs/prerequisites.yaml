---
# yaml-language-server: $schema=../../../../../../../schema/zarf-v1alpha1-package-prerequisites-schema.json
#
# The prerequisites of the dependency rather than of a candidate. It is not an alternative to
# anything, so it carries no `provides.priority`: nothing ever ranks it against another package.
#
# What it does carry is a capability, which is how csi-aws-ebs could come to name what it needs
# rather than the package that happens to supply it today.
#
# Nothing here is contacted.
apiVersion: colonel-byte.dev/v1alpha1
kind: PackagePrerequisites
metadata:
  package: pkg-aws-ccm
  version: 0.0.12
  description: The AWS Cloud Controller Manager, required by the AWS CSI drivers

requires:
  packages:
    - name: init

provides:
  capabilities:
    - name: cloud-controller-manager
      version: "0.0.12"
