---
# yaml-language-server: $schema=../../../../../../../schema/zarf-v1alpha1-package-prerequisites-schema.json
#
# The low-priority candidate of the `storage` group. It is the one the cluster-precedence rule is tested with: already deployed, it outranks csi-rook-ceph's higher priority.
#
# Nothing here is contacted.
apiVersion: colonel-byte.dev/v1alpha1
kind: PackagePrerequisites
metadata:
  package: csi-longhorn
  version: 1.9.2
  description: A storage provider the bundle rates below Rook-Ceph

requires:
  packages:
    - name: init

provides:
  priority: 50
  capabilities:
    - name: storage-class
      version: "1.9.2"
  namespaces:
    - longhorn-system
