---
# Where Flux pulls the External Secrets Operator chart from. The version is a fixed tag rather than
# a semver range: a range means the cluster's content changes without the package's version
# changing, and an air-gapped cluster cannot resolve one anyway -- the only tag in the registry is
# the one zarf pushed when this package was deployed.
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: external-secrets
  namespace: external-secrets
spec:
  interval: 30m
  url: oci://ghcr.io/external-secrets/charts/external-secrets
  ref:
    tag: 2.12.0
