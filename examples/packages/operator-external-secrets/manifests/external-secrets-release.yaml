---
# The HelmRelease helm-controller reconciles. This is the manifest that does nothing at all on a
# cluster with no helm-controller: it is accepted by the API server, it never becomes ready, and
# `zarf package deploy` has already reported success by then.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: external-secrets
  namespace: external-secrets
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: external-secrets
    namespace: external-secrets
  install:
    crds: Create
  upgrade:
    crds: CreateReplace
  values:
    # The CRDs come from the chart rather than from a separate component, which is what the
    # install.crds setting above is for. A package that installed them twice would fight itself on
    # upgrade.
    installCRDs: true
