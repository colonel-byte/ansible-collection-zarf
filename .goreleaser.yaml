---
version: 2

project_name: zarf-ansible-modules

before:
  hooks:
    # The Ansible collection is a release artifact of its own: the management node that runs the
    # playbooks is inside the airlock, so it installs the collection from this tarball rather than
    # from Galaxy. A snapshot passes no version, because its version is not the one in galaxy.yml.
    - hack/ansible-build-collection.sh bin/ansible {{ if .IsSnapshot }}""{{ else }}{{ .Version }}{{ end }} ansible/colonel_byte/zarf

builds:
  # The Ansible module wrapper. It is a module file rather than a CLI: it reads JSON parameters,
  # has zarf do the work, and writes one JSON object, so it is only ever invoked by Ansible or by
  # an operator reproducing such a run. Zarf is linked in and its own command tree is what
  # executes, so no zarf is needed on the node. See docs/agent/choice-zarf-ansible-module.md.
  #
  # One build for every module, not one per module. The binary answers as whichever zarf_ name it
  # was invoked under -- which is ZEP-0072's own design -- so the packages below install it once
  # and symlink each module file name to it. Built per module it would ship a copy of zarf's
  # dependency tree per module, which is most of the 269MB each.
  #
  # It is large for that reason. riscv64 is in the list and does build; it is checked by
  # cross-compiling, not assumed.
  #
  # Linux only: Ansible runs the module file on the management node, and the management nodes this
  # is for run Linux.
  - id: zarfmod
    main: ./cmd/zarfmod
    binary: zarfmod
    ldflags:
      - -s
      - -w
    gcflags:
      - all=-l
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - arm64
      - amd64
      - riscv64
    goamd64:
      - v1
    flags:
      - -trimpath
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  # The wrapper, archived on its own. A tar.gz cannot carry the module file symlinks the packages
  # install, so whoever unpacks this links the names themselves -- `ln -s zarfmod zarf_init` and
  # so on, which ansible/colonel_byte/zarf/plugins/modules/README.md spells out. ids is explicit
  # rather than omitted: without it a second build added later would land in this archive
  # silently.
  - id: zarf_modules
    ids:
      - zarfmod
    formats:
      - tar.gz
    name_template: >-
      zarf_ansible_modules_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else }}{{ .Arch }}{{ end }}

checksum:
  name_template: "checksums.txt"

sboms:
  - artifacts: archive

snapshot:
  version_template: "{{ incpatch .Version }}-snapshot"

nfpms:
  - id: packagers
    package_name: zarf-ansible-modules
    # The wrapper, listed explicitly so that adding a second build does not silently add a second
    # binary to this package.
    ids:
      - zarfmod
    license: Apache 2.0
    maintainer: |-
      Allen Conlon <software@conlon.dev>
    description: |-
      Ansible modules for zarf: initialise an air-gapped cluster, stage packages, mirror their
      resources, deploy and remove them, rotate the cluster's credentials, and reach it with the
      kubectl zarf carries -- all from a playbook. A proof of ZEP-0072.
    formats:
      - apk
      - deb
      - rpm
    goamd64:
      - v1
    mtime: "{{ .CommitDate }}"
    contents:
      # The Ansible collection. /usr/share/ansible/collections is on ansible-core's default
      # collections path, so installing the package is all a management node needs beyond a
      # zarf of its own.
      - src: ansible/colonel_byte/zarf
        dst: /usr/share/ansible/collections/ansible_collections/colonel_byte/zarf
        type: tree
        # Explicit, and not a tidiness preference.
        file_info:
          mode: 0755
      # One module file name per module, each a symlink to the one wrapper. The name is how the
      # binary knows which module to answer as -- it dispatches on argv[0] -- so these are the
      # module files rather than a convenience. There is no Python module behind any of them.
      # See docs/agent/choice-zarf-ansible-module.md.
      - src: /usr/bin/zarfmod
        dst: /usr/bin/zarf_init
        type: symlink
      - src: /usr/bin/zarfmod
        dst: /usr/bin/zarf_kubectl
        type: symlink
      - src: /usr/bin/zarfmod
        dst: /usr/bin/zarf_package_deploy
        type: symlink
      - src: /usr/bin/zarfmod
        dst: /usr/bin/zarf_package_mirror_resources
        type: symlink
      - src: /usr/bin/zarfmod
        dst: /usr/bin/zarf_package_pull
        type: symlink
      - src: /usr/bin/zarfmod
        dst: /usr/bin/zarf_package_remove
        type: symlink
      - src: /usr/bin/zarfmod
        dst: /usr/bin/zarf_update_creds
        type: symlink
      # And the same names under the collection, for a conventional Ansible caller that stages a
      # module file. The action plugins do not need them: they invoke /usr/bin/zarf_<module>
      # directly.
      - src: /usr/bin/zarf_init
        dst: /usr/share/ansible/collections/ansible_collections/colonel_byte/zarf/plugins/modules/zarf_init
        type: symlink
      - src: /usr/bin/zarf_kubectl
        dst: /usr/share/ansible/collections/ansible_collections/colonel_byte/zarf/plugins/modules/zarf_kubectl
        type: symlink
      - src: /usr/bin/zarf_package_deploy
        dst: /usr/share/ansible/collections/ansible_collections/colonel_byte/zarf/plugins/modules/zarf_package_deploy
        type: symlink
      - src: /usr/bin/zarf_package_mirror_resources
        dst: /usr/share/ansible/collections/ansible_collections/colonel_byte/zarf/plugins/modules/zarf_package_mirror_resources
        type: symlink
      - src: /usr/bin/zarf_package_pull
        dst: /usr/share/ansible/collections/ansible_collections/colonel_byte/zarf/plugins/modules/zarf_package_pull
        type: symlink
      - src: /usr/bin/zarf_package_remove
        dst: /usr/share/ansible/collections/ansible_collections/colonel_byte/zarf/plugins/modules/zarf_package_remove
        type: symlink
      - src: /usr/bin/zarf_update_creds
        dst: /usr/share/ansible/collections/ansible_collections/colonel_byte/zarf/plugins/modules/zarf_update_creds
        type: symlink
    rpm:
      compression: gzip

dockers_v2:
  # A management node image: ansible-core, the collection, the module wrapper with its module
  # file names linked to it, and a zarf for the read-only modules to drive. It pulls in the nfpms artifacts rather than the raw binaries because
  # containers/ansible/Dockerfile installs the rpm, which is what puts the collection on
  # ansible-core's collections path and every module file symlink under plugins/modules -- the
  # layout its smoke checks assert.
  - id: zarf-ansible
    ids:
      - packagers
    dockerfile: containers/ansible/Dockerfile
    images:
      - "ghcr.io/colonel-byte/zarf-ansible-modules"
    tags:
      - "{{ .Tag }}"
    # No riscv64: the builds carry one, but neither base image publishes a manifest for it.
    platforms:
      - linux/amd64
      - linux/arm64
    flags:
      - "--pull"
    build_args:
      ANSIBLE_CORE_VERSION: 2.16.16-2.el10_2.1
      BASH_COMPLETION_VERSION: 2.11-16.el10
    labels:
      "org.opencontainers.image.description": |-
        Ansible modules for zarf, with ansible-core and zarf installed
      "org.opencontainers.image.version": |-
        {{ .Version }}
      "org.opencontainers.image.revision": |-
        {{ .FullCommit }}
      "org.opencontainers.image.created": |-
        {{ .CommitDate }}
      "org.opencontainers.image.base.name": |-
        {{ .BaseImage }}
      "org.opencontainers.image.base.digest": |-
        {{ .BaseImageDigest }}
      "index,manifest:org.opencontainers.image.source": |-
        https://github.com/colonel-byte/ansible-collection-zarf
      "index,manifest:org.opencontainers.image.title": |-
        zarf-ansible-modules
      "index,manifest:org.opencontainers.image.licenses": |-
        Apache-2.0
      "index,manifest:org.opencontainers.image.description": |-
        Ansible modules for zarf, with ansible-core and zarf installed

changelog:
  sort: asc

signs:
  - id: checksum
    cmd: cosign
    signature: "${artifact}.sigstore.json"
    args:
      - "sign-blob"
      - "--key=env://COSIGN_PRIVATE_KEY"
      - "--bundle=${signature}"
      - "${artifact}"
      - "--yes"
    artifacts: checksum
    stdin: "{{ .Env.COSIGN_PASSWORD }}"
  - id: archive
    cmd: cosign
    signature: "${artifact}.sigstore.json"
    args:
      - "sign-blob"
      - "--key=env://COSIGN_PRIVATE_KEY"
      - "--bundle=${signature}"
      - "${artifact}"
      - "--yes"
    artifacts: archive
    stdin: "{{ .Env.COSIGN_PASSWORD }}"

release:
  github:
    owner: colonel-byte
    name: ansible-collection-zarf
  name_template: "v{{ .Version }}"
  mode: append
  # The collection tarball and its signature are built by the before hook above rather than by a
  # build, so they reach the release this way. They carry their own cosign bundle because the
  # checksums file covers artifacts the pipeline built itself.
  extra_files:
    - glob: bin/ansible/colonel_byte-zarf-*.tar.gz
    - glob: bin/ansible/colonel_byte-zarf-*.tar.gz.sigstore.json
