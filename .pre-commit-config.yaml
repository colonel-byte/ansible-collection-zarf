---
# Every hook that walks files excludes vendor/. The tree is tens of thousands of files of other
# people's code: addlicense would stamp a copyright header onto it, the whitespace and smartquote
# fixers would rewrite it, and ruff and golangci-lint would report on it. All of that is noise, and
# some of it would make the vendored tree differ from what `go mod vendor` produces -- which is the
# one property the directory has to keep.
#
# These excludes are not the whole story for prek. prek also discovers nested config files and runs
# each as its own project, and two vendored dependencies ship a .pre-commit-config.yaml of their
# own -- github.com/bodgit/sevenzip and github.com/fairwindsops/pluto/v5. An exclude cannot reach
# that, because it filters the files a hook walks rather than which configs prek finds. Run prek
# with `-c .pre-commit-config.yaml`, which turns discovery off. See AGENTS.md.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        # vendor/ and the reference packages' upstream/ trees are both committed copies of
        # somebody else's source, written by a generator from a pinned version rather than by a
        # person. The guard is here to catch a blob committed by accident, and nothing in either
        # tree arrives by accident -- Argo CD's applicationset-crd.yaml is 1.4 MB of OpenAPI
        # schema because that is what the CRD weighs upstream, and dropping it would ship the
        # ApplicationSet controller in namespace-install.yaml with no CRD to reconcile.
        exclude: ^(vendor/|examples/packages/[^/]+/upstream/)
        args:
          - "--maxkb=1024"
      - id: check-merge-conflict
      - id: detect-aws-credentials
        exclude: vendor/.*
        args:
          - "--allow-missing-credentials"
      - id: fix-byte-order-marker
        exclude: vendor/.*
      - id: end-of-file-fixer
        exclude: vendor/.*
      - id: trailing-whitespace
        args:
          - --markdown-linebreak-ext=md
        exclude: vendor/.*
  - repo: https://github.com/sirosen/texthooks
    rev: 1.0.0
    hooks:
      - id: fix-smartquotes
        exclude: vendor/.*
  - repo: https://github.com/google/addlicense
    rev: v1.2.0
    hooks:
      - id: addlicense
        exclude: vendor/.*
        exclude_types:
          - yaml
          - markdown
        args:
          - -c
          - colonel-byte
          - -l
          - apache
          - -y
          - "2026"
  - repo: https://github.com/google/keep-sorted
    rev: v0.10.0
    hooks:
      - id: keep-sorted
  - repo: https://github.com/golangci/golangci-lint
    rev: v2.15.0
    hooks:
      - id: golangci-lint
        language_version: "1.27.2"
        exclude: vendor/.*
      - id: golangci-lint-config-verify
        language_version: "1.27.2"
        exclude: vendor/.*
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.1
    hooks:
      # Errors only, and deliberately not the formatter. All of this repository's Python is Ansible
      # action plugins, written against ansible-core's plugin API: a style rule would have opinions
      # about that API, and a formatter would rewrite files whose shape is dictated by it. What is
      # wanted is the class of mistake nothing else here catches -- an unused import, a name that
      # does not exist, an assignment nothing reads -- which is pyflakes (F) plus ruff's syntax and
      # IO errors (E9).
      - id: ruff-check
        args:
          - --select=F,E9
          - --target-version=py39
        exclude: vendor/.*
  - repo: https://github.com/python-jsonschema/check-jsonschema
    rev: 0.38.2
    hooks:
      # The reference packages' prerequisites documents, against the schema this repository
      # generates from the Go types in api/.
      #
      # TestExampleDocumentsMatchTheTypes already decodes these into those types with unknown
      # fields rejected, and that is not the same check. It holds a document against the *types*;
      # this holds it against the *generated schema*, which is what editors and other repositories
      # actually validate against. A jsonschema tag that rendered wrong -- an enum missing a value,
      # a constraint that did not survive generation -- would leave the two disagreeing, and a Go
      # test reflecting over the types could never see it.
      #
      # It is also the only thing here that exercises the schema the way a consumer does. The Go
      # test says plainly that it avoids a JSON Schema validator rather than vendor a Go
      # dependency for one; this is that validator, as a hook rather than a module.
      - id: check-jsonschema
        name: check-jsonschema-prerequisites
        files: ^examples/packages/[^/]+/docs/prerequisites\.yaml$
        args:
          - --schemafile
          - schema/zarf-v1alpha1-package-prerequisites-schema.json
      # Each reference package's vendoring declaration, against its own generated schema.
      - id: check-jsonschema
        name: check-jsonschema-resources
        files: ^examples/packages/[^/]+/resources\.json$
        args:
          - --schemafile
          - schema/package-resources-schema.json
  - repo: local
    hooks:
      - id: docs-generator
        name: generate-docs
        language: system
        pass_filenames: false
        entry: go run ./magefiles/core generate:document
