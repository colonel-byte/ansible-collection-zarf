---
# The role's documented interface.
argument_specs:
  main:
    short_description: Deploy a list of Zarf packages to a cluster with component-level drift detection
    description:
      - "Iterates over a list of Zarf packages to deploy, inspecting each package definition and checking installed cluster components before deploying."
      - "An item that names components is skipped when every one of them is already deployed on the cluster at the same package version, and no excluded component is. An item that names none is always deployed: the role compares component names, and with none to compare it has nothing to go on."
      - "Skipping settles for a package that one item deploys. It does not settle for a package that several items deploy in phases, because C(zarf package list) reports only the most recent deploy's components -- so each phase sees the other's and both re-deploy every run. That reconciles rather than fails; see the C(choice-deploy-packages-drift-scope) page in the book."
      - "When deployment is executed, invokes C(zarf_init) for packages of type C(init), or C(zarf_package_deploy) for standard packages. Both verify the package against C(zarf_public_key) when one is named."
      - "Optionally writes deployment results as JSON files to C(zarf_result_dir), refreshes the C(zarf_packages) fact once the stack is deployed, and sets C(zarf_deploy_packages_changed) to whether any item reached zarf."
      - "Every task carries C(run_once: true) and delegates to C(zarf_delegate_to)."
    version_added: "0.31.0"
    options:
      zarf_packages_to_deploy:
        type: list
        elements: dict
        default: []
        description:
          - "The list of packages to deploy. Each item is a dictionary specifying package deployment parameters."
          - "C(path): (required) Path to the Zarf package tarball or OCI source."
          - "C(package_type): Type of deployment. Set to C(init) to invoke C(zarf_init), or C(package) / C(deploy) (default: C(package)) to invoke C(zarf_package_deploy)."
          - "C(components): List of component names to deploy. Prefix with C(-) to exclude (e.g. C(-git-server))."
          - "Naming them is also what lets the item be skipped. Left unset, zarf chooses the components itself -- every non-optional one, plus any optional one marked default, resolved per package API version -- and the role does not work out what that set would be, so the item is deployed every run."
          - "C(set_variables): Dictionary of template variable overrides passed as C(--set key=val)."
          - "C(kubeconfig): Kubeconfig path override for this package."
          - "C(public_key): Public key path override for signature verification."
          - "C(verify): Verification mode override (C(never), C(if-possible), C(always))."
          - "C(timeout): Timeout override for this package deployment."
          - "C(wrapper_binary): Wrapper binary override for this package."
          - "C(registry_mode): Registry mode override for C(init) packages (C(nodeport), C(proxy), C(external))."
          - "C(injector_image): Injector image override for C(init) packages. Overrides C(zarf_injector_image), and zarf requires it whenever the registry mode is C(proxy)."
          - "C(connected): Whether the cluster pulls the package's images itself rather than zarf pushing them. Overrides C(zarf_connected), and applies to non-init packages only."
          - "C(take_ownership): Whether zarf adopts cluster resources it did not create. Overrides C(zarf_take_ownership)."
          - "C(force_conflicts): Whether zarf overrides a server-side-apply conflict. Overrides C(zarf_force_conflicts)."
          - "C(log_level): Zarf log level for this package (e.g. C(warn), C(info), C(debug), C(trace)). Overrides C(zarf_log_level)."
          - "C(log_dest): Destination file path to write deployment result JSON. Overrides the name the role would build under C(zarf_result_dir)."
          - "C(delegate_to): Host override on which this package operation runs."
          - "C(zarf_binary): Path to C(zarf) binary override for this package."
      zarf_kubeconfig:
        type: str
        default: ""
        description:
          - "Default path to the kubeconfig file used to reach the cluster. Can be overridden per package item."
      zarf_public_key:
        type: str
        default: ""
        description:
          - "Default path to the public key used to verify package signatures. Can be overridden per package item."
      zarf_verify:
        type: str
        default: ""
        choices:
          - ""
          - never
          - if-possible
          - always
        description:
          - "When to verify package signatures. Left empty, requires a signature if C(zarf_public_key) is specified."
      zarf_timeout:
        type: str
        default: ""
        description:
          - "Default timeout duration for package deployment tasks (e.g. C(15m), C(1h)). Can be overridden per package item."
      zarf_init_wrapper:
        type: str
        default: ""
        description:
          - "Default wrapper binary path for C(zarf_init) tasks."
      zarf_deploy_wrapper:
        type: str
        default: ""
        description:
          - "Default wrapper binary path for C(zarf_package_deploy) tasks."
      zarf_result_dir:
        type: str
        default: ""
        description:
          - "Directory where deployment result logs are written as JSON. If empty, result files are not written unless C(log_dest) is set on the package item."
          - "The name inside it is the item's position in the stack, then the package's file name without its extension -- C(1-zarf-init-amd64-v0.88.0.json). The position leads it because the package does not identify the item: a bundle names the same init package twice, and a name built from the package alone would have the second step overwrite the first step's result."
      zarf_log_level:
        type: str
        default: ""
        description:
          - "Default Zarf log level (e.g. C(warn), C(info), C(debug), C(trace)). Left empty, zarf's own default applies. Can be overridden per package item."
      zarf_take_ownership:
        type: str
        default: ""
        choices:
          - ""
          - "true"
          - "false"
        description:
          - "Whether zarf adopts cluster resources it did not create, which Helm otherwise refuses to do. Can be overridden per package item."
          - "Left empty, zarf's own default applies. Empty is the third state a boolean does not have: it is what distinguishes a stack that said nothing from one that said false."
      zarf_force_conflicts:
        type: str
        default: ""
        choices:
          - ""
          - "true"
          - "false"
        description:
          - "Whether zarf overrides a server-side-apply conflict rather than failing on it. Can be overridden per package item."
          - "Left empty, zarf's own default applies. Turning it on means the deploy takes fields another controller owns, so it is stated by whoever is deploying rather than assumed by this role."
      zarf_registry_mode:
        type: str
        default: ""
        choices:
          - ""
          - nodeport
          - proxy
          - external
        description:
          - "How zarf reaches the registry an C(init) package stands up. Can be overridden per package item, and applies to C(init) packages only."
          - "Left empty, zarf's own default applies."
      zarf_injector_image:
        type: str
        default: ""
        description:
          - "The image the zarf injector runs, which must already be present on every node. Can be overridden per package item, and applies to C(init) packages only."
          - "Zarf requires it whenever the registry mode is C(proxy): zarf 0.89.0 removed the heuristic that picked a node's pause image, so an init in proxy mode that names no image is refused."
          - "Left empty, zarf's own default applies."
      zarf_connected:
        type: str
        default: ""
        choices:
          - ""
          - "true"
          - "false"
        description:
          - "Whether the cluster pulls a package's images itself rather than zarf pushing them to the registry. Can be overridden per package item, and applies to non-init packages only."
          - "A connected deploy needs no registry, so it is the one deploy that works on a cluster nothing has initialised -- which is what lets a storage provider be deployed before the initialisation that claims a volume from it."
          - "Left empty, zarf's own default applies."
      zarf_binary:
        type: str
        default: zarf
        description:
          - "Path to the C(zarf) binary on the delegated host."
      zarf_delegate_to:
        type: str
        default: localhost
        description:
          - "The node on which to execute inspection and deployment tasks."
