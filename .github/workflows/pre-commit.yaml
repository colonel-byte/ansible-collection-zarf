---
name: Validate pre-commit hooks

on:
  pull_request:
  merge_group:

permissions:
  contents: read

jobs:
  prek:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Runs the hooks from .pre-commit-config.yaml, so licensing, formatting
      # and sorting can never drift from the local pre-commit setup. Skipped:
      #   docs-generator - a `repo: local` hook that shells out to mage and
      #     regenerates files; it needs the full dev toolchain.
      #   golangci-lint - already covered by the Validate Lint workflow.
      #
      # -c names the config instead of letting prek discover them. prek runs
      # every nested .pre-commit-config.yaml as its own project, and two
      # vendored dependencies ship one, so without it this job runs other
      # projects' hooks over vendored code and fails on their toolchain rather
      # than on anything in this repository. See the root AGENTS.md.
      - name: Run hooks
        uses: j178/prek-action@44924fe9ef4a6f88253c4b6b1bf11c689d3ce53d # v3.1.0
        with:
          extra-args: >-
            --all-files
            --config .pre-commit-config.yaml
            --skip docs-generator
            --skip golangci-lint
