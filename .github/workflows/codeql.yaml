---
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  schedule:
    # Weekly, off the hour: scheduled scans keep the security tab current for
    # advisories published after a commit landed.
    - cron: "37 5 * * 1"

permissions:
  contents: read

# Abort prior jobs in the same workflow / PR
concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # Go is built rather than scanned buildless, so the build step below
          # is what decides which packages get extracted.
          - language: go
            build-mode: manual
          # The action plugins are where parameters are delivered and where
          # zarf_state_info's redaction lives, so they are scanned too.
          - language: python
            build-mode: none
          - language: actions
            build-mode: none
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup golang
        if: matrix.build-mode == 'manual'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Initialize CodeQL
        uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      # The package patterns are spelled out instead of ./... because magefiles/ is
      # package main behind //go:build mage, and mage supplies the main function at
      # runtime, so `go build` cannot compile it at all -- with or without -tags mage.
      # Those targets are dev tooling and ship in no binary, so they are left
      # unanalyzed. CodeQL's `paths-ignore` cannot fix this: it does not apply to Go,
      # which is analyzed by building it, so the exclusion has to live here.
      - name: Build
        if: matrix.build-mode == 'manual'
        run: go build -mod=vendor ./cmd/... ./internal/...
        env:
          CGO_ENABLED: 0
          # Everything the build needs is vendored, so make any accidental network access
          # fail fast. Matches unit-tests.yaml and e2e.yaml.
          GOFLAGS: -mod=vendor
          GOPROXY: "off"
          GOSUMDB: "off"
          GOTOOLCHAIN: local

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          category: "/language:${{ matrix.language }}"
