---
name: goreleaser

on:
  push:
    tags:
      - "*"

# Read only at the top so that a job has to ask for what it writes.
permissions:
  contents: read

jobs:
  goreleaser:
    # - contents: write creates the release and uploads the archives
    # - id-token: write is the OIDC token cosign signs against
    # - attestations: write proves provenance of the built artifacts
    # - packages: write pushes the management node image to ghcr.io
    permissions:
      contents: write
      id-token: write
      attestations: write
      packages: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # /tmp on the hosted image is a 7.9G tmpfs, not part of the 145G root filesystem, and
      # three parallel builds of a binary carrying zarf's whole dependency tree put more than
      # that in the Go compiler's scratch directory. The build dies with "disk quota exceeded"
      # writing /tmp/go-build.../importcfg while df reports ~88G free on /, so the message is
      # true and the obvious reading of it -- that the runner is out of disk -- is wrong.
      # Freeing disk space does nothing. GOTMPDIR moves the scratch onto the work volume,
      # which is on /.
      #
      # It goes through GITHUB_ENV rather than a job-level env: block because the runner context
      # is not available there, and a workflow referencing it fails to load at all rather than
      # failing a step.
      #
      # df covers every mount rather than one, so the next failure of this kind says which
      # filesystem ran out instead of leaving it to be inferred.
      - name: Keep the Go compiler's scratch off /tmp
        run: |
          mkdir -p "${RUNNER_TEMP}/go-build"
          echo "GOTMPDIR=${RUNNER_TEMP}/go-build" >>"${GITHUB_ENV}"
          df -h

      - name: Setup Syft
        uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3

      - name: Setup cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # The goreleaser before hook shells out to ansible-galaxy to build the collection
      # tarball, so the release fails at its first step without this.
      - name: Setup ansible-core
        run: pipx install ansible-core

      - name: Setup golang
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # The dockers_v2 pipe builds containers/ansible for amd64 and arm64 in one pass, so the
      # runner needs emulation for whichever of the two it is not, and buildx to drive it.
      - name: Setup QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0

      # Both base images come from ghcr.io, and the manifest is pushed there too.
      - name: Login to GitHub Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASS }}
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_KEY }}

      - name: Attest packages
        id: attest-packages
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: ./dist/checksums.txt

      - name: Render AI-BOM
        run: |
          jq \
            --arg version "${GITHUB_REF_NAME}" \
            --arg commit "${GITHUB_SHA}" \
            --arg generatedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '.subject.version = $version | .subject.commit = $commit | .generatedAt = $generatedAt' \
            .github/ai-bom.json > dist/ai-bom.json

      - name: Attest AI-BOM
        id: attest-ai-bom
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/ai-bom.json

      - name: Publish provenance with the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp "${{ steps.attest-packages.outputs.bundle-path }}" zarf_ansible_modules_packages.intoto.jsonl
          cp "${{ steps.attest-ai-bom.outputs.bundle-path }}" zarf_ansible_modules_ai-bom.intoto.jsonl

          gh release upload "${GITHUB_REF_NAME}" \
            zarf_ansible_modules_packages.intoto.jsonl \
            zarf_ansible_modules_ai-bom.intoto.jsonl \
            dist/ai-bom.json --clobber
