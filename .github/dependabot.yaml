---
version: 2
updates:
  - package-ecosystem: gomod
    directory: "/"
    schedule:
      interval: daily
    allow:
      - dependency-type: "all"
    open-pull-requests-limit: 50
    groups:
      k8s:
        patterns:
          - "k8s.io/*"
          - "sigs.k8s.io/*"
      opentelemetry:
        patterns:
          - "go.opentelemetry.io/*"
      sigstore:
        patterns:
          - "github.com/sigstore/*"
      golang:
        patterns:
          - "golang.org/x/*"
      docker:
        patterns:
          - "github.com/docker/*"
          - "github.com/moby/*"
          - "github.com/containerd/*"
      cloud-kms:
        patterns:
          - "github.com/aws/*"
          - "github.com/Azure/*"
          - "cloud.google.com/go/*"
      openapi:
        patterns:
          - "github.com/go-openapi/*"
  - package-ecosystem: pre-commit
    directory: "/"
    schedule:
      interval: daily
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: daily
    groups:
      core:
        patterns:
          - "*"
  - package-ecosystem: npm
    directory: "/.github/commitlint"
    schedule:
      interval: weekly
    groups:
      commitlint:
        patterns:
          - "*"
  - package-ecosystem: docker
    directory: "/containers/ansible"
    schedule:
      interval: daily
    groups:
      containers:
        patterns:
          - "*"
